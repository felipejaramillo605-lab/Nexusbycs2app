name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PIP_EXTRA_INDEX_URL: https://d33sy5i8bnduwe.cloudfront.net/simple/

jobs:
  backend-lint:
    name: Backend lint (flake8 + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install black==26.5.1 flake8==7.3.0

      - name: Find changed backend .py files
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- 'backend/*.py' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed backend .py files: $FILES"

      # Only lints files touched by this PR/push — the existing backend/ has ~10k
      # pre-existing flake8 findings and would need reformatting on ~35 files,
      # none of which this task was asked to clean up. This gate catches new
      # regressions without failing on unrelated legacy debt.
      - name: black --check (changed files only)
        if: steps.changed.outputs.files != ''
        run: python -m black --check --line-length 120 ${{ steps.changed.outputs.files }}

      - name: flake8 (changed files only)
        if: steps.changed.outputs.files != ''
        run: python -m flake8 --max-line-length 120 ${{ steps.changed.outputs.files }}

  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: test_database
      EMERGENT_LLM_KEY: dummy-ci-key
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start backend server
        working-directory: backend
        run: |
          nohup uvicorn server:app --host 0.0.0.0 --port 8001 > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/api/ > /dev/null 2>&1; then
              echo "Backend is up"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become ready in time"
          cat server.log
          exit 1

      - name: Seed demo data
        working-directory: backend
        run: python seed_data.py

      - name: Run pytest
        working-directory: backend
        env:
          REACT_APP_BACKEND_URL: http://localhost:8001
        run: python -m pytest tests/

      - name: Show backend logs on failure
        if: failure()
        run: cat backend/server.log

  frontend:
    name: Frontend build (eslint + yarn build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      # CI=false: CRA/craco treats every ESLint warning as a build-breaking error
      # when CI=true (which GitHub Actions sets by default). There are pre-existing
      # warnings unrelated to this task; a real syntax/type error still fails the
      # build regardless of this flag.
      - name: Build
        working-directory: frontend
        env:
          CI: "false"
        run: yarn build
