; NEXUS_8A7G1B2B3A_APPOINTMENT_EMAIL_WORKER_SUPERVISOR_V1
[program:appointment_email_worker]
command=/root/.venv/bin/python3 /app/backend/appointment_email_worker.py
directory=/app/backend
autostart=true
autorestart=true
startsecs=3
startretries=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/appointment_email_worker.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/appointment_email_worker.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
user=root
environment=HOME="/root",USER="root"
